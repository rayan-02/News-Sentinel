{% extends "base.html" %}

{% block content %}

<div id="articles-error" class="error" hidden></div>

<div class="page-intro">
    <div>
        <p class="eyebrow">ARTICLE DATABASE</p>
        <h2>Articles</h2>
        <p>
            Browse the articles processed by the News Sentinel pipeline.
        </p>
    </div>

    <div class="topic-count" id="article-count">
        —
    </div>
</div>

<section class="card filters-card">

    <div class="filters">

        <div class="filter">
            <label for="source-filter">Source</label>
            <select id="source-filter">
                <option value="">All sources</option>
            </select>
        </div>

        <div class="filter">
            <label for="topic-filter">Topic</label>
            <select id="topic-filter">
                <option value="">All topics</option>
            </select>
        </div>

        <div class="filter">
            <label for="sentiment-filter">Sentiment</label>
            <select id="sentiment-filter">
                <option value="">All sentiment</option>
            </select>
        </div>

        <div class="filter search-filter">
            <label for="article-search">Search</label>
            <input
                type="text"
                id="article-search"
                placeholder="Search article titles..."
            >
        </div>

    </div>

</section>

<section class="card">

    <div class="card-header">
        <h2 class="card-title">Article List</h2>
        <span class="card-meta" id="article-result-count">—</span>
    </div>

    <div id="articles-list">
        <div class="empty">Loading articles...</div>
    </div>

</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/articles.js') }}"></script>
{% endblock %}
